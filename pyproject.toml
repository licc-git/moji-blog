[project]
name = "moji-blog"
version = "0.1.0"
description = "一个基于 Flask 的精致单用户个人博客系统，记录学习笔记与日常随笔。"
readme = "prompt.md"
requires-python = "==3.12"
dependencies = [
    "flask==3.0",
    "flask-sqlalchemy==3.1",
    "flask-login==0.6",
    "flask-wtf==1.2",
    "flask-migrate==4.0",
    "pymysql==1.1",
    "cryptography==42.0",
    "python-dotenv==1.0",
    "markdown==3.6",
    "pygments==2.18",
    "openai==1.40",
    "email-validator==2.2",
    "bleach==6.1",
    "gevent==26.5.0",
]

[project.optional-dependencies]
dev = [
    "python-dotenv==1.0",
]
prod = [
    "gunicorn==22.0",
]

[tool.uv]
package = false

# Flask 应用入口配置：使用 `uv run flask` 时自动识别
[tool.flask]
app = "wsgi:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
