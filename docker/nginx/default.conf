# 墨记博客 · nginx 反向代理配置
# 链路：浏览器 :5099 → nginx(本机监听 5099) → web 容器 :5099 (gunicorn)

server {
    listen 5099;
    server_name _;  # 换成你的域名

    # ── 客户端最大上传大小 ──
    client_max_body_size 1M;

    # ── 静态资源：直接由 Nginx 提供，不经过 Gunicorn ──
    location /static/ {
        alias /home/licc/my_blog/app/static/;
        # 静态资源缓存 7 天
        expires 7d;
        # 资源公开且永不变
        add_header Cache-Control "public, immutable";
    }

    # ── 上传文件：同样由 Nginx 直接提供 ──
    location /uploads/ {
        alias /home/licc/my_blog/uploads/;
        expires 60d;
        add_header Cache-Control "public, immutable";
    }

    # ── 动态请求：转发给 Gunicorn ──
    location / {
        proxy_pass http://web:5099;

        # 传递客户端真实 IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # 缓冲设置
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
}