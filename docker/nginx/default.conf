# 墨记博客 · nginx 反向代理配置
# 链路：浏览器 :5099 → nginx(本机监听 5099) → web 容器 :5099 (gunicorn)

server {
    # 对外监听端口，与 compose.yaml 中 nginx 的 ports: "5099:5099" 对应
    listen 5099;
    server_name localhost;

    location / {
        # web = compose 服务名（即容器主机名），5099 是 gunicorn 的监听端口
        proxy_pass http://web:5099;

        # 传递真实客户端信息给 Flask（日志、URL 生成、重定向依赖这些头）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
